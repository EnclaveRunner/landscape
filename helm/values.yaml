replicaCount: 1

image:
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

postgres:
  enabled: true
  image: postgres:18-alpine
  environment:
    POSTGRES_DB: "enclave_db"
    POSTGRES_USER: "enclave_user"
    POSTGRES_PASSWORD: "enclave_password"
  ports:
    - containerPort: 5432

valkey:
  enabled: true
  image: valkey/valkey:latest
  ports:
    - containerPort: 6379

apiServer:
  enabled: true
  image: ghcr.io/enclaverunner/api-server:0.11
  ports:
    - containerPort: 8080
  environment:
    ENCLAVE_PORT: "8080"
    ENCLAVE_LOG_LEVEL: "debug"
    ENCLAVE_PRODUCTION_ENVIRONMENT: "true"
    ENCLAVE_HUMAN_READABLE_OUTPUT: "true"
    ENCLAVE_DATABASE_HOST: "enclave-postgres"
    ENCLAVE_DATABASE_PORT: "5432"
    ENCLAVE_DATABASE_USER: "enclave_user"
    ENCLAVE_DATABASE_PASSWORD: "enclave_password"
    ENCLAVE_DATABASE_NAME: "enclave_db"
    ENCLAVE_ADMIN_USERNAME: "enclave"
    ENCLAVE_ADMIN_DISPLAY_NAME: "System"
    ENCLAVE_ADMIN_PASSWORD: "enclave"
    ENCLAVE_ARTIFACT_REGISTRY_HOST: "enclave-artifact-registry"
    ENCLAVE_ARTIFACT_REGISTRY_PORT: "5000"
    ENCLAVE_REDIS_HOST: "enclave-valkey"
    ENCLAVE_REDIS_PORT: "6379"

webUi:
  enabled: true
  image: ghcr.io/enclaverunner/web-ui:0.6
  ports:
    - containerPort: 8091
  environment:
    API_BASE_URL: "enclave-api-server"
    API_PORT: "8080"

artifactRegistry:
  enabled: true
  image: ghcr.io/enclaverunner/artifact-registry:0.5
  ports:
    - containerPort: 5000
  environment:
    ENCLAVE_PORT: "5000"
    ENCLAVE_LOG_LEVEL: "debug"
    ENCLAVE_PRODUCTION_ENVIRONMENT: "true"
    ENCLAVE_HUMAN_READABLE_OUTPUT: "true"
    ENCLAVE_DATABASE_HOST: "enclave-postgres"
    ENCLAVE_DATABASE_PORT: "5432"
    ENCLAVE_DATABASE_USER: "enclave_user"
    ENCLAVE_DATABASE_PASSWORD: "enclave_password"
    ENCLAVE_DATABASE_NAME: "enclave_db"

runner:
  enabled: true
  image: ghcr.io/enclaverunner/runner:0.4.1
  environment:
    ENCLAVE_REDIS_HOST: "enclave-valkey"
    ENCLAVE_REDIS_PORT: "6379"
    ENCLAVE_ARTIFACT_REGISTRY_HOST: "enclave-artifact-registry"
    ENCLAVE_ARTIFACT_REGISTRY_PORT: "5000"
    ENCLAVE_LOG_LEVEL: "debug"
    ENCLAVE_HUMAN_READABLE_OUTPUT: "true"
