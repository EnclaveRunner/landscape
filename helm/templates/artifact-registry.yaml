{{- if .Values.artifactRegistry.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-artifact-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-artifact-registry
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-artifact-registry
    spec:
      containers:
        - name: artifact-registry
          image: "{{ .Values.artifactRegistry.image }}"
          ports:
            {{- toYaml .Values.artifactRegistry.ports | nindent 12 }}
          env:
            {{- range $key, $val := .Values.artifactRegistry.environment }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-artifact-registry
spec:
  selector:
    app: {{ .Release.Name }}-artifact-registry
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
{{- end }}
