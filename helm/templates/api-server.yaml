{{- if .Values.apiServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api-server
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api-server
    spec:
      containers:
        - name: api-server
          image: "{{ .Values.apiServer.image }}"
          ports:
            {{- toYaml .Values.apiServer.ports | nindent 12 }}
          env:
            {{- range $key, $val := .Values.apiServer.environment }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api-server
spec:
  selector:
    app: {{ .Release.Name }}-api-server
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
{{- end }}
