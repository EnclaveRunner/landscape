{{- if .Values.valkey.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-valkey
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-valkey
    spec:
      containers:
        - name: valkey
          image: "{{ .Values.valkey.image }}"
          ports:
            {{- toYaml .Values.valkey.ports | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-valkey
spec:
  selector:
    app: {{ .Release.Name }}-valkey
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
{{- end }}
