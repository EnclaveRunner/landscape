replicaCount: 1

image:
  pullPolicy: IfNotPresent

postgres:
  image: postgres:18-alpine
  env:
    POSTGRES_DB: enclave_db
    POSTGRES_USER: enclave_user
    POSTGRES_PASSWORD: enclave_password

valkey:
  image: valkey/valkey:latest

apiServer:
  image: ghcr.io/enclaverunner/api-server:0.11
  env:
    ENCLAVE_PORT: 8080
    ENCLAVE_LOG_LEVEL: debug
    ENCLAVE_PRODUCTION_ENVIRONMENT: "true"
    ENCLAVE_HUMAN_READABLE_OUTPUT: "true"
    ENCLAVE_REDIS_HOST: "valkey"
    ENCLAVE_DATABASE_HOST: postgres
    ENCLAVE_DATABASE_PORT: 5432
    ENCLAVE_DATABASE_USER: enclave_user
    ENCLAVE_DATABASE_PASSWORD: enclave_password
    ENCLAVE_DATABASE_NAME: enclave_db
    ENCLAVE_ADMIN_USERNAME: enclave
    ENCLAVE_ADMIN_DISPLAY_NAME: System
    ENCLAVE_ADMIN_PASSWORD: enclave
    ENCLAVE_ARTIFACT_REGISTRY_HOST: artifact-registry
    ENCLAVE_ARTIFACT_REGISTRY_PORT: 5000

webUi:
  image: ghcr.io/enclaverunner/web-ui:0.6
  env:
    API_BASE_URL: api-server
    API_PORT: 8080

artifactRegistry:
  image: ghcr.io/enclaverunner/artifact-registry:0.5
  env:
    ENCLAVE_PORT: 5000
    ENCLAVE_LOG_LEVEL: debug
    ENCLAVE_PRODUCTION_ENVIRONMENT: "true"
    ENCLAVE_HUMAN_READABLE_OUTPUT: "true"
    ENCLAVE_DATABASE_HOST: postgres
    ENCLAVE_DATABASE_PORT: 5432
    ENCLAVE_DATABASE_USER: enclave_user
    ENCLAVE_DATABASE_PASSWORD: enclave_password
    ENCLAVE_DATABASE_NAME: enclave_db

runner:
  image: ghcr.io/enclaverunner/runner:0.4.1
  env:
    ENCLAVE_LOG_LEVEL: debug
    ENCLAVE_HUMAN_READABLE_OUTPUT: "true"
    ENCLAVE_REDIS__HOST: valkey
    ENCLAVE_REDIS__PORT: 6379
    ENCLAVE_ARTIFACT_REGISTRY__HOST: http://artifact-registry
    ENCLAVE_ARTIFACT_REGISTRY__PORT: 5000
    ENCLAVE_DATABASE__USERNAME: enclave_user
    ENCLAVE_DATABASE__PASSWORD: enclave_password
    ENCLAVE_DATABASE__DB: enclave_db

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
# className: "traefik"
# host: "enclave.local"
  annotations: {}
    # traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # traefik.ingress.kubernetes.io/router.tls: "true"
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
