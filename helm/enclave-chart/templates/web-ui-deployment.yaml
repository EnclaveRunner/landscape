apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: web-ui
  template:
    metadata:
      labels:
        app: web-ui
    spec:
      containers:
        - name: web-ui
          image: "{{ .Values.webUi.image }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: API_BASE_URL
              value: {{ .Values.webUi.env.API_BASE_URL | quote }}
            - name: API_PORT
              value: {{ .Values.webUi.env.API_PORT | quote }}
          ports:
            - containerPort: 8091
