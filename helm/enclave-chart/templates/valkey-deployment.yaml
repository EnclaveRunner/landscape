apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: "{{ .Values.valkey.image }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 6379
